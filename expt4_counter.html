<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   body{
    background-color:rgb(2, 2, 21);
    margin: 0;
    text-align: center;
}




.msg-box{
    width: 280px;
}

.msg-box textarea{
    width: 100%;
    height: 50px;
    background-color: rgb(26, 26, 65);
    color: white;
}

.counter{
    display: block;
    text-align: right;
    color: white;
    font-size: 12px;
}
.container{
    margin-top: 40px;
    display: flex;
    flex-direction: column; /* stack vertically */
    align-items: center;    /* center items */
}


</style>
<body>
    <div style="height:70px; background-color:rgb(26, 26, 65);"></div>
    <h2 style="color:white; margin-top:40px;">Admin Dashboard</h2>
    <div class="container">
    <div class="msg-box">
        <textarea id="message" placeholder="Enter your message..." required maxlength="150"></textarea>
        <small class="counter">
            <span id="count">0</span>/150 characters
        </small>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    let msg = document.getElementById("message");
    let count = document.getElementById("count");
    msg.addEventListener("input", function(){
        count.textContent = msg.value.length;
    });
});
</script>


</body>
</html>
