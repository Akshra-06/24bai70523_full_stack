<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body bgcolor="lightblue">

    <h1 align="center">Login Page</h1>

    <div style="
        width: 300px;
        margin: auto;
        padding: 20px;
        background: white;
        border: 2px solid black;
        border-radius: 10px;
        text-align: center;
    ">

        <form action="/submit_login" method="post">

            <label for="username"><b>Username:</b></label><br>
            <input type="text" id="username" name="username" style="border: 1px solid black;"><br><br>

            <label for="pass"><b>Password:</b></label><br>
            <input type="password" id="password" name="password" style="border: 1px solid black;"><br><br>

            <input type="submit" value="Login" style="border: 1px solid black; background: lightblue;">

        </form>

    </div>

</body>
</html>
